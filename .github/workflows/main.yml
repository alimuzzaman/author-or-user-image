name: Deploy to WordPress.org
on:
  push:
    tags:
    - "*"
permissions:
  contents: read
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Validate release package
      run: python3 tools/check-release.py --tag "$GITHUB_REF_NAME" --zip-output "$RUNNER_TEMP/author-or-user-image.zip"
    - name: Lint production PHP
      run: |
        for f in author_image.php index.php uninstall.php includes/*.php; do
          php -l "$f"
        done
    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
