<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 772 250" role="img" aria-labelledby="title desc">
<title id="title">Author or User Image</title>
<desc id="desc">Your profile. Your picture. A framed local avatar with an upload arrow, in teal, mint, and gold. The lower-left area is deliberately empty for the directory title overlay.</desc>
