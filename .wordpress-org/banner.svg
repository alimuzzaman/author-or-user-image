<text x="38" y="81" font-size="39" font-weight="700" letter-spacing="-1.4">Author or</text>
<text x="38" y="124" font-size="39" font-weight="700" letter-spacing="-1.4">User Image</text>
<text x="40" y="157" font-size="17" font-weight="400" fill="#476460">Your profile. Your picture.</text>
